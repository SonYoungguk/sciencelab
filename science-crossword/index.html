<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>과학 용어 퍼즐 배틀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: lab-notebook graph paper; a header strip, then the grid beside its clue list (stacks on phones). */
:root{
  --paper:#f5f7f6; --sheet:#ffffff; --rule:#d9e3e0; --ink:#17302b; --muted:#5d716c;
  --accent:#0f7a63; --accent-ink:#ffffff; --warn:#c2410c; --ok:#15803d; --bad:#b91c1c;
  --cell:#ffffff; --cell-block:transparent; --cell-sel:#d6f1e8; --cell-word:#ecf8f4;
  --p1:#2563eb; --p2:#db2777; --p3:#d97706; --p4:#7c3aed;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1715; --sheet:#16211e; --rule:#24332f; --ink:#e4efec; --muted:#93a8a2;
  --accent:#34d3a6; --accent-ink:#06261d; --warn:#fb923c; --ok:#4ade80; --bad:#f87171;
  --cell:#1d2b27; --cell-sel:#1f5446; --cell-word:#1a3a32;
  --p1:#60a5fa; --p2:#f472b6; --p3:#fbbf24; --p4:#a78bfa; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1715; --sheet:#16211e; --rule:#24332f; --ink:#e4efec; --muted:#93a8a2;
  --accent:#34d3a6; --accent-ink:#06261d; --warn:#fb923c; --ok:#4ade80; --bad:#f87171;
  --cell:#1d2b27; --cell-sel:#1f5446; --cell-word:#1a3a32;
  --p1:#60a5fa; --p2:#f472b6; --p3:#fbbf24; --p4:#a78bfa; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
button,.btn{font:inherit;font-weight:700;border-radius:8px;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);padding:10px 16px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:var(--rule)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--cell);border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0}
textarea{width:100%;min-height:180px;font-size:13px;line-height:1.6;resize:vertical;box-sizing:border-box}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top .sub{color:var(--muted)}
.code-badge{font-family:var(--mono);font-size:13px;border:1.5px dashed var(--ink);border-radius:6px;padding:4px 10px}

/* home */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.home .sheet{display:flex;flex-direction:column;gap:12px}
.home input{width:100%;box-sizing:border-box}
.notice{border-left:4px solid var(--warn);padding:8px 12px;background:var(--sheet);border-radius:4px;font-size:14px}

/* crossword grid */
.board{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.board{grid-template-columns:minmax(0,1fr)}}
.gridbox{overflow-x:auto}
.cw{display:grid;gap:2px;margin:0 auto;width:max-content}
.cw .c{width:var(--cs);height:var(--cs);position:relative;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:calc(var(--cs)*.5);background:var(--cell);border:1.5px solid var(--ink);border-radius:3px;box-sizing:border-box;cursor:pointer;user-select:none}
.cw .c.x{background:transparent;border-color:transparent;cursor:default}
.cw .c .n{position:absolute;top:1px;left:3px;font-size:calc(var(--cs)*.24);font-weight:500;font-family:var(--mono);color:var(--muted);line-height:1}
.cw .c.word{background:var(--cell-word)}
.cw .c.sel{background:var(--cell-sel)}
.cw .c.solved{color:var(--ok)}
.cw .c.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.answerbar{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--sheet)}
.answerbar .q{font-size:15px}
.answerbar .q b{font-family:var(--mono)}
.answerbar form{display:flex;gap:8px}
.answerbar input{flex:1;font-size:18px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.clues{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:520px){.clues{grid-template-columns:1fr}}
.clues ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.clues li{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px;display:grid;grid-template-columns:2.2em 1fr;gap:4px}
.clues li .k{font-family:var(--mono);font-weight:700;color:var(--muted)}
.clues li:hover{background:var(--cell-word)}
.clues li.active{background:var(--cell-sel)}
.clues li.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ok)}

/* status strip */
.strip{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.chip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--rule);border-radius:999px;padding:4px 12px 4px 6px;background:var(--sheet);font-size:14px}
.chip .dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.chip.me{border-color:var(--ink)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;padding:4px 14px;border-radius:8px;border:1.5px solid var(--ink);background:var(--sheet)}
.timer.hot{background:var(--warn);border-color:var(--warn);color:#fff}

/* spectator */
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pcard{border-top:6px solid var(--pc);display:flex;flex-direction:column;gap:10px}
.pcard .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .score{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--pc)}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pc);transition:width .4s}
.mini{display:grid;gap:1px;margin:0 auto}
.mini i{width:var(--ms);height:var(--ms);border-radius:2px;background:var(--cell);border:1px solid var(--rule);box-sizing:border-box;font-style:normal;font-size:calc(var(--ms)*.6);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.mini i.x{background:transparent;border-color:transparent}
.mini i.f{background:var(--pc);border-color:var(--pc)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--pc);color:#fff}
.feed{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;font-size:14px}
.feed div{display:flex;gap:8px}
.feed .t{font-family:var(--mono);color:var(--muted);flex:none}

/* lobby */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.slot{border:1.5px dashed var(--rule);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;min-height:52px}
.slot.on{border-style:solid;border-color:var(--pc)}
.slot .dot{width:28px;height:28px;border-radius:50%;background:var(--pc);flex:none}
.slot .kick{margin-left:auto;padding:4px 8px;font-size:12px}
.bigcode{font-family:var(--mono);font-size:clamp(40px,10vw,72px);font-weight:700;letter-spacing:.15em;line-height:1}

/* overlays */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.count{font-family:var(--display);font-size:min(40vw,220px);color:var(--accent);line-height:1}
.results{max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.rank{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--rule);border-left:6px solid var(--pc);border-radius:8px}
.rank .pos{font-family:var(--display);font-size:26px;text-align:center}
.rank.first{border-color:var(--pc);border-left-width:6px}
.rank .meta{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
.preview .cw .c{cursor:default}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div class="stack" style="gap:4px">
      <span class="label">과학 교과서 용어 · 실시간 4인 대결</span>
      <h1>과학 용어 퍼즐 배틀</h1>
    </div>
    <div class="row" id="topRight"></div>
  </div>
  <div id="view"><div class="sheet"><p class="muted">불러오는 중…</p></div></div>
</div>
<div id="layer"></div>

<script>
/* ===================== 단어 세트 ===================== */
const SETS = {
"물질의 구성과 변화": `원소 | 더 이상 다른 물질로 분해되지 않는, 물질을 이루는 기본 성분
원자 | 물질을 이루는 가장 작은 입자로, 원자핵과 전자로 이루어져 있다
원자핵 | 원자의 중심에 있으며 (+)전하를 띠는 부분
전자 | 원자핵 주위를 움직이며 (−)전하를 띠는 입자
분자 | 물질의 성질을 가지는 가장 작은 입자
이온 | 원자가 전자를 잃거나 얻어서 전하를 띠게 된 입자
양이온 | 원자가 전자를 잃어 (+)전하를 띠는 입자
음이온 | 원자가 전자를 얻어 (−)전하를 띠는 입자
화합물 | 두 종류 이상의 원소가 화학적으로 결합한 물질
혼합물 | 두 가지 이상의 순물질이 섞여 있는 물질
순물질 | 한 가지 물질로만 이루어진 물질
산소 | 물질이 탈 때 필요하며, 원소 기호가 O인 기체
수소 | 가장 가벼운 원소로, 원소 기호는 H
탄소 | 원소 기호가 C이며, 숯과 다이아몬드를 이루는 원소
질소 | 공기의 약 78%를 차지하는 기체
이산화탄소 | 석회수를 뿌옇게 흐리게 만드는 기체
산화 | 물질이 산소를 얻는 반응
환원 | 산화물이 산소를 잃는 반응
불꽃반응 | 금속 원소를 불꽃에 넣어 나타나는 고유한 색으로 원소를 구별하는 방법
앙금 | 두 수용액을 섞었을 때 생기는, 물에 잘 녹지 않는 고체
원소기호 | 원소를 알파벳으로 간단하게 나타낸 것`,
"생물의 구조와 에너지": `세포 | 생물을 구성하는 기본 단위
세포막 | 세포를 둘러싸고 물질의 출입을 조절하는 얇은 막
세포벽 | 식물 세포의 가장 바깥에서 세포를 보호하고 모양을 유지하는 벽
엽록체 | 식물 세포에서 광합성이 일어나는 초록색 알갱이
광합성 | 빛에너지를 이용해 이산화탄소와 물로 양분을 만드는 과정
증산작용 | 잎의 기공을 통해 물이 수증기로 빠져나가는 현상
기공 | 잎의 뒷면에 많은, 공변세포로 둘러싸인 작은 구멍
공변세포 | 기공을 둘러싸고 기공을 열고 닫는 세포
호흡 | 세포에서 양분을 분해해 생명 활동에 필요한 에너지를 얻는 과정
소화 | 음식물 속 영양소를 흡수할 수 있는 크기로 분해하는 과정
효소 | 몸속 화학 반응이 빠르게 일어나도록 돕는 물질
녹말 | 아이오딘 반응으로 청람색을 나타내는 영양소
단백질 | 뷰렛 반응으로 보라색을 나타내는 영양소
포도당 | 녹말이 분해되어 만들어지는 당으로, 베네딕트 반응에 황적색을 나타낸다
미토콘드리아 | 세포 호흡이 일어나는 세포 소기관
적혈구 | 헤모글로빈이 있어 산소를 운반하는 혈구
백혈구 | 몸속에 들어온 병원체를 잡아먹는 혈구
혈소판 | 상처가 났을 때 혈액을 굳게 하는 혈액 성분
혈액 | 심장의 박동으로 온몸을 순환하는 액체
심장 | 혈액을 온몸으로 내보내는 펌프 역할을 하는 기관
기관지 | 기관에서 갈라져 폐로 들어가는 관
폐포 | 폐를 이루는 작은 공기주머니로, 기체 교환이 일어나는 곳`,
"힘과 에너지": `중력 | 지구가 물체를 끌어당기는 힘
마찰력 | 물체가 접촉한 면에서 운동을 방해하는 힘
탄성력 | 변형된 물체가 원래 모양으로 되돌아가려는 힘
부력 | 액체나 기체가 물체를 위쪽으로 밀어 올리는 힘
자기력 | 자석과 자석 사이에 작용하는 힘
전기력 | 전하를 띤 물체 사이에 작용하는 힘
속력 | 단위 시간 동안 물체가 이동한 거리
가속도 | 단위 시간 동안 속도가 변하는 정도
관성 | 물체가 원래의 운동 상태를 유지하려는 성질
운동에너지 | 운동하는 물체가 가진 에너지
위치에너지 | 높은 곳에 있는 물체가 가진 에너지
역학적에너지 | 위치 에너지와 운동 에너지의 합
전류 | 전하의 흐름
전압 | 전류를 흐르게 하는 능력
전기저항 | 전류의 흐름을 방해하는 정도
자기장 | 자석 주위에 자기력이 작용하는 공간
전자기유도 | 코일 근처에서 자석을 움직일 때 전류가 흐르는 현상
열평형 | 온도가 다른 두 물체가 접촉해 온도가 같아진 상태
비열 | 물질 1kg의 온도를 1℃ 높이는 데 필요한 열량
열팽창 | 물체가 열을 받아 부피가 늘어나는 현상
전력 | 전기 기구가 단위 시간 동안 사용하는 전기 에너지`,
"지구와 우주": `지각 | 지구의 가장 바깥층
맨틀 | 지각 아래에 있으며 지구 부피의 대부분을 차지하는 층
외핵 | 지구 내부에서 액체 상태인 층
내핵 | 지구의 가장 중심에 있는 고체 상태의 층
광물 | 암석을 이루는 작은 알갱이
화성암 | 마그마가 식어서 굳어진 암석
퇴적암 | 퇴적물이 쌓여 굳어진 암석
변성암 | 높은 열과 압력으로 성질이 변한 암석
풍화 | 암석이 오랜 시간 동안 부서지고 잘게 쪼개지는 현상
지진 | 지구 내부의 에너지가 방출되며 땅이 흔들리는 현상
화산 | 마그마가 지표로 분출하여 만들어진 지형
기압 | 공기가 단위 넓이에 작용하는 힘
습도 | 공기 중에 수증기가 포함된 정도
이슬점 | 공기 중의 수증기가 응결하기 시작하는 온도
포화수증기량 | 1kg의 공기가 최대로 포함할 수 있는 수증기의 양
기단 | 기온과 습도가 비슷한 거대한 공기 덩어리
전선 | 성질이 다른 두 기단이 만나는 경계면이 지표면과 만나는 선
태양계 | 태양과 그 주위를 도는 천체들의 무리
행성 | 태양 주위를 공전하는 천체 (수성, 금성, 지구 등)
위성 | 행성 주위를 도는 천체
은하 | 수많은 별과 성간 물질이 모인 거대한 집단
연주시차 | 지구의 공전 때문에 생기는 별의 시차의 1/2
흑점 | 태양 표면에 검게 보이는 부분
자전 | 천체가 스스로 회전하는 운동
공전 | 천체가 다른 천체 주위를 도는 운동`
};
const MAX_PLAYERS = 4, END_GRACE = 30000;
const COLORS = ["var(--p1)","var(--p2)","var(--p3)","var(--p4)"];

/* ===================== 퍼즐 생성기 ===================== */
function parseList(text){
  const seen=new Set(), out=[];
  for(const line of text.split(/\n/)){
    const m=line.split("|"); if(m.length<2) continue;
    const w=m[0].replace(/\s+/g,"").trim(), clue=m.slice(1).join("|").trim();
    if(Array.from(w).length<2||!clue||seen.has(w)) continue;
    seen.add(w); out.push({w,clue});
  }
  return out;
}
function generate(entries, tries=300){
  let best=null;
  for(let t=0;t<tries;t++){
    const order=entries.slice(); for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    const res=tryBuild(order);
    const score=res.placed.length*1000-res.islands*120-res.area;
    if(!best||score>best.score) best={...res,score};
  }
  return finalize(best.placed);
}
function tryBuild(order){
  const cells=new Map(); // "r,c" -> {ch, dirs:Set}
  const placed=[];
  const k=(r,c)=>r+","+c;
  const put=(e,r,c,d)=>{const s=Array.from(e.w);s.forEach((ch,i)=>{const rr=r+(d==="d"?i:0),cc=c+(d==="a"?i:0);const key=k(rr,cc);
    if(!cells.has(key))cells.set(key,{ch,dirs:new Set()});cells.get(key).dirs.add(d)});placed.push({w:e.w,clue:e.clue,r,c,d})};
  const fits=(s,r,c,d)=>{
    const dr=d==="d"?1:0,dc=d==="a"?1:0; let cross=0;
    if(cells.has(k(r-dr,c-dc))||cells.has(k(r+dr*s.length,c+dc*s.length))) return -1;
    for(let i=0;i<s.length;i++){
      const rr=r+dr*i,cc=c+dc*i,cell=cells.get(k(rr,cc));
      if(cell){ if(cell.ch!==s[i]||cell.dirs.has(d)) return -1; cross++; }
      else if(cells.has(k(rr+dc,cc+dr))||cells.has(k(rr-dc,cc-dr))) return -1;
    }
    return cross;
  };
  let pending=order.slice(); put(pending.shift(),0,0,"a");
  let progress=true;
  while(progress&&pending.length){
    progress=false;
    for(let idx=0;idx<pending.length;idx++){
      const e=pending[idx], s=Array.from(e.w); let opts=[];
      for(const [key,cell] of cells){
        const [r0,c0]=key.split(",").map(Number);
        if(cell.dirs.size!==1) continue;
        const d=cell.dirs.has("a")?"d":"a";
        s.forEach((ch,i)=>{ if(ch!==cell.ch) return;
          const r=d==="d"?r0-i:r0, c=d==="a"?c0-i:c0, x=fits(s,r,c,d);
          if(x>0) opts.push({r,c,d,x}); });
      }
      if(opts.length){
        const mx=Math.max(...opts.map(o=>o.x)); opts=opts.filter(o=>o.x===mx);
        const o=opts[Math.floor(Math.random()*opts.length)];
        put(e,o.r,o.c,o.d); pending.splice(idx,1); idx--; progress=true;
      }
    }
  }
  const bbox=()=>{let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;
    for(const key of cells.keys()){const [r,c]=key.split(",").map(Number);r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c);}
    return {r0,r1,c0,c1};};
  // 겹치는 글자가 없는 용어는 떨어진 자리에 따로 놓는다 (교사가 넣은 용어가 빠지지 않도록)
  let islands=0;
  for(const e of pending){
    const s=Array.from(e.w), b=bbox(); let best=null;
    for(const d of ["a","d"]) for(let r=b.r0-2;r<=b.r1+2;r++) for(let c=b.c0-2;c<=b.c1+2;c++){
      if(fits(s,r,c,d)<0) continue;
      const nr0=Math.min(b.r0,r),nc0=Math.min(b.c0,c),nr1=Math.max(b.r1,r+(d==="d"?s.length-1:0)),nc1=Math.max(b.c1,c+(d==="a"?s.length-1:0));
      const h=nr1-nr0+1,w=nc1-nc0+1,cost=h*w+Math.abs(h-w)*4+Math.random();
      if(!best||cost<best.cost) best={r,c,d,cost};
    }
    if(best){ put(e,best.r,best.c,best.d); islands++; }
  }
  const b=bbox(), h=b.r1-b.r0+1, w=b.c1-b.c0+1;
  return {placed,islands,area:h*w+Math.abs(h-w)*4};
}
function finalize(placed){
  let r0=1e9,c0=1e9,r1=-1e9,c1=-1e9;
  placed.forEach(p=>{const L=Array.from(p.w).length;r0=Math.min(r0,p.r);c0=Math.min(c0,p.c);
    r1=Math.max(r1,p.r+(p.d==="d"?L-1:0));c1=Math.max(c1,p.c+(p.d==="a"?L-1:0));});
  const words=placed.map(p=>({...p,r:p.r-r0,c:p.c-c0}));
  const starts=[...new Set(words.map(w=>w.r*1000+w.c))].sort((a,b)=>a-b);
  words.forEach(w=>w.n=starts.indexOf(w.r*1000+w.c)+1);
  words.sort((a,b)=>a.d===b.d?a.n-b.n:(a.d==="a"?-1:1));
  words.forEach((w,i)=>w.id=i);
  return {rows:r1-r0+1,cols:c1-c0+1,words};
}
function cellMap(pz){
  const m=new Map();
  pz.words.forEach(w=>Array.from(w.w).forEach((ch,i)=>{
    const r=w.r+(w.d==="d"?i:0),c=w.c+(w.d==="a"?i:0),key=r+","+c;
    if(!m.has(key))m.set(key,{ch,r,c,words:[],n:null});
    const cell=m.get(key); cell.words.push(w.id); if(i===0)cell.n=w.n;
  }));
  return m;
}

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function writeErr(e){
  if(e&&e.code==="invalid_argument"){S.readOnly=true;toast("저장할 권한이 없습니다. 이 페이지를 '참가자(Contributor)' 이상 권한으로 공유받아야 합니다.");}
  else if(e&&e.code==="quota_exceeded") toast("저장 공간이 가득 찼습니다. 선생님께 알려 주세요.");
  else toast("저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
}
function queueWrite(fn){S.writeChain=S.writeChain.then(fn).catch(writeErr);return S.writeChain;}

/* game derivations */
const curPlayers=()=>S.players.filter(p=>p.exists!==false).sort((a,b)=>a.slot-b.slot);
function validSolved(p){
  const room=S.room; if(!room||p.gameId!==room.gameId) return {};
  const out={}; const lim=room.endAt?room.endAt+1500:Infinity;
  for(const [k,t] of Object.entries(p.solved||{})) if(t<=lim) out[k]=t;
  return out;
}
function standings(){
  const total=S.room?.puzzle?.words.length||0;
  return curPlayers().map(p=>{
    const sv=validSolved(p), n=Object.keys(sv).length, last=n?Math.max(...Object.values(sv)):Infinity;
    return {...p,score:n,total,last,finished:n===total&&total>0?last:null};
  }).sort((a,b)=>b.score-a.score||a.last-b.last);
}
function phase(){
  const r=S.room; if(!r) return "none";
  if(r.status==="lobby") return "lobby";
  if(r.status==="ended") return "ended";
  const now=Date.now();
  if(now<r.startAt) return "countdown";
  if(r.endAt&&now>=r.endAt) return "ended";
  return "playing";
}

/* ===================== 방 입장 & 구독 ===================== */
async function enterRoom(role,code,pid,name,create){
  S.unsub.forEach(u=>u()); S.unsub=[]; Object.assign(S,{role,code,pid,name,room:null,players:[],feed:[],lastCounts:{},wasJoined:false,sel:null,skel:null,abarKey:null});
  store.set("cw-session",JSON.stringify({role,code,pid,name}));
  if(create){
    try{ await S.db.doc("rooms/"+code).set({code,status:"setup",gameId:null,puzzle:null,setName:Object.keys(SETS)[0],startAt:null,endAt:null,firstFinisher:null,createdAt:Date.now()}); }
    catch(e){ writeErr(e); return renderHome(); }
  }
  $("#view").innerHTML=`<div class="sheet"><p class="muted">방 ${esc(code)}에 연결하는 중…</p></div>`;
  const slow=setTimeout(()=>{ if(!S.room) $("#view").innerHTML=`<div class="sheet stack"><p>방 정보를 아직 받지 못했습니다. 네트워크 연결을 확인해 주세요.</p><button id="back">처음으로</button></div>`, $("#back")&&($("#back").onclick=leave); },10000);
  S.unsub.push(S.db.doc("rooms/"+code).onSnapshot(snap=>{
    clearTimeout(slow);
    if(!snap.exists){ if(!snap.metadata.fromCache){ toast("방이 없습니다."); leave(); } return; }
    const prev=S.room; S.room=snap.data();
    if(prev&&prev.gameId!==S.room.gameId){ S.feed=[]; S.lastCounts={}; S.sel=null; }
    if(S.role==="teacher"&&!S.draftPuzzle&&S.room.puzzle) S.draftPuzzle=S.room.puzzle;
    render();
  },e=>{clearTimeout(slow);toast("방 연결이 끊겼습니다.");}));
  S.unsub.push(S.db.collection(`rooms/${code}/players`).onSnapshot(snap=>{
    S.players=snap.docs.filter(d=>d.exists).map(d=>d.data());
    if(S.role==="player"){
      const me=S.players.find(p=>p.pid===S.pid);
      if(me) S.wasJoined=true;
      else if(S.wasJoined&&!snap.metadata.fromCache){ toast("방에서 나가게 되었습니다."); return leave(); }
    }
    trackFeed(); render();
  }));
}
function leave(){ S.unsub.forEach(u=>u()); S.unsub=[]; store.set("cw-session",""); S.role=null; S.room=null; S.skel=null; renderHome(); }

function trackFeed(){
  if(!S.room?.puzzle) return;
  for(const p of curPlayers()){
    const sv=validSolved(p), prev=S.lastCounts[p.pid]||{};
    for(const [id,t] of Object.entries(sv)) if(!prev[id]){
      const w=S.room.puzzle.words[id]; if(w) S.feed.unshift({t,name:p.name,slot:p.slot,label:`${w.n}번 ${w.d==="a"?"가로":"세로"}`});
    }
    S.lastCounts[p.pid]=sv;
  }
  S.feed.sort((a,b)=>b.t-a.t); S.feed=S.feed.slice(0,40);
}

/* ===================== 진행 감시 (타이머, 1등 처리) ===================== */
setInterval(()=>{
  if(!S.room) return;
  tickTimer();
  const ph=phase();
  if(S.lastPhase!==ph){ S.lastPhase=ph; render(); }
  // 교사 화면이 1등 완주를 감지하면 종료 시각을 정한다 (학생 화면이 먼저 정하는 것의 보조)
  if(S.role==="teacher"&&ph==="playing"&&!S.room.endAt&&!S.settingEnd){
    const st=standings().filter(p=>p.finished).sort((a,b)=>a.finished-b.finished)[0];
    if(st) setFirst(st);
  }
  if(S.role==="teacher"&&ph==="ended"&&S.room.status==="playing"&&!S.settingEnd){
    S.settingEnd=true; queueWrite(()=>S.db.doc("rooms/"+S.code).update({status:"ended"})).finally(()=>S.settingEnd=false);
  }
},250);
function setFirst(p){
  if(S.room.endAt||S.settingEnd) return;
  S.settingEnd=true;
  const at=p.finished||Date.now();
  queueWrite(()=>S.db.doc("rooms/"+S.code).update({endAt:at+END_GRACE,firstFinisher:{pid:p.pid,name:p.name,at}})).finally(()=>S.settingEnd=false);
}
function tickTimer(){
  const el=$("#timer"); if(!el||!S.room) return;
  const ph=phase(), now=Date.now();
  if(ph==="playing"&&S.room.endAt){ el.textContent="종료까지 "+Math.ceil((S.room.endAt-now)/1000)+"초"; el.classList.add("hot"); }
  else if(ph==="playing"){ el.textContent=fmt(now-S.room.startAt); el.classList.remove("hot"); }
  else if(ph==="ended"){ el.textContent="종료"; el.classList.remove("hot"); }
  else el.textContent="--:--";
  const cd=$("#countNum"); if(cd&&ph==="countdown") cd.textContent=Math.ceil((S.room.startAt-now)/1000);
}

  renderLayer(); tickTimer();
}

function gridHTML(pz,{filled,sel,showAll,cs}){
  const cm=cellMap(pz); const selWord=sel!=null?pz.words[sel]:null; const selCells=new Set();
  if(selWord) Array.from(selWord.w).forEach((_,i)=>selCells.add((selWord.r+(selWord.d==="d"?i:0))+","+(selWord.c+(selWord.d==="a"?i:0))));
  let h=`<div class="cw" style="--cs:${cs}px;grid-template-columns:repeat(${pz.cols},var(--cs))">`;
  for(let r=0;r<pz.rows;r++)for(let c=0;c<pz.cols;c++){
    const cell=cm.get(r+","+c);
    if(!cell){h+=`<div class="c x"></div>`;continue;}
    const show=showAll||cell.words.some(id=>filled&&filled[id]);
    h+=`<div class="c ${selCells.has(r+","+c)?"sel":""} ${show&&!showAll?"solved":""}" data-k="${r},${c}">${cell.n?`<span class="n">${cell.n}</span>`:""}${show?esc(cell.ch):""}</div>`;
  }
  return h+"</div>";
}
function cellSize(pz,box){ const w=(box?.clientWidth||600)-4; return Math.max(26,Math.min(48,Math.floor((w-(pz.cols-1)*2)/pz.cols))); }

    </div>
    <div class="spec">
      ${st.map((p,i)=>{const sv=validSolved(p);const filledCells=new Set();Object.keys(sv).forEach(id=>{const w=pz.words[id];Array.from(w.w).forEach((_,j)=>filledCells.add((w.r+(w.d==="d"?j:0))+","+(w.c+(w.d==="a"?j:0))));});
        let mini=`<div class="mini" style="--ms:${ms}px;grid-template-columns:repeat(${pz.cols},var(--ms))">`;
        for(let r=0;r<pz.rows;r++)for(let c=0;c<pz.cols;c++){const k=r+","+c,cell=cm.get(k);mini+=!cell?`<i class="x"></i>`:`<i class="${filledCells.has(k)?"f":""}">${S.showAnswers&&filledCells.has(k)&&ms>=12?esc(cell.ch):""}</i>`;}
        mini+="</div>";
        return `<section class="sheet pcard" style="--pc:${COLORS[p.slot]}">
          <div class="head"><h3>${i+1}위 · ${esc(p.name)}</h3>${p.finished?`<span class="badge">완주</span>`:""}</div>
          <div class="row" style="justify-content:space-between"><span class="score">${p.score}<span class="muted" style="font-size:16px"> / ${total}</span></span>
          <span class="muted mono" style="font-size:13px">오답 ${p.gameId===room.gameId?(p.wrong||0):0}</span></div>
          <div class="bar"><i style="width:${total?p.score/total*100:0}%"></i></div>
          ${mini}
        </section>`;}).join("")||`<div class="sheet muted">참가한 학생이 없습니다.</div>`}
    </div>
    <div class="board">
      <section class="sheet stack"><h3>퍼즐 ${S.showAnswers?"(정답)":""}</h3><div class="gridbox preview" id="gbox"></div></section>
      <section class="sheet stack"><h3>실시간 정답 기록</h3><div class="feed">${S.feed.map(f=>`<div><span class="t">${fmt(f.t-room.startAt)}</span><span style="color:${COLORS[f.slot]};font-weight:700">${esc(f.name)}</span><span>${f.label} 정답</span></div>`).join("")||`<span class="muted">아직 정답이 없습니다.</span>`}</div></section>
    </div>
  </div>`;
  const box=$("#gbox"); box.innerHTML=gridHTML(pz,{showAll:S.showAnswers,cs:cellSize(pz,box)});
  $("#ansBtn").onclick=()=>{S.showAnswers=!S.showAnswers;render();};
  $("#endSoon")&&($("#endSoon").onclick=()=>queueWrite(()=>S.db.doc("rooms/"+S.code).update({endAt:Date.now()+END_GRACE})));
  $("#endNow")&&($("#endNow").onclick=()=>queueWrite(()=>S.db.doc("rooms/"+S.code).update({endAt:Date.now(),status:"ended"})));
  $("#again")&&($("#again").onclick=()=>{S.draftPuzzle=room.puzzle;queueWrite(()=>S.db.doc("rooms/"+S.code).update({status:"lobby",startAt:null,endAt:null,firstFinisher:null}));});
}
const ALL="__all", CUSTOM="__custom";
function sampleWords(list,n){
  const a=list.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return n>0?a.slice(0,n):a;
}
function renderTeacherSetup(){
  if(S.skel!=="setup:"+S.code){
    S.skel="setup:"+S.code;
    $("#view").innerHTML=`
  <div class="stack">
    <section class="sheet row" style="justify-content:space-between">
      <div class="stack" style="gap:4px"><span class="label">학생에게 알려 줄 방 번호</span><span class="bigcode">${esc(S.code)}</span></div>
      <div class="stack" style="gap:8px;align-items:flex-end">
        <button class="primary" id="startBtn" disabled>게임 시작</button>
        <span class="muted" style="font-size:13px">시작할 때마다 새 퍼즐이 무작위로 만들어지고, 3초 뒤 모든 학생 화면에 동시에 열립니다.</span>
      </div>
    </section>
    <section class="sheet stack"><h3>참가자</h3><div class="slots" id="slots"></div></section>
    <section class="sheet stack">
      <h3>출제 범위</h3>
      <div class="row" style="align-items:flex-end">
        <label class="stack" style="gap:4px;flex:2 1 220px"><span class="label">교과서 단원</span>
          <select id="setSel">${Object.keys(SETS).map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join("")}<option value="${ALL}">전체 단원 섞기</option><option value="${CUSTOM}">직접 입력</option></select></label>
        <label class="stack" style="gap:4px;flex:1 1 140px"><span class="label">한 판에 나올 단어 수</span>
          <select id="nSel"><option value="10">10개</option><option value="15">15개</option><option value="20">20개</option><option value="0">목록 전체</option></select></label>
      </div>
      <label class="stack" style="gap:4px"><span class="label" id="wcount">한 줄에 하나씩 · 용어 | 설명</span>
        <textarea id="words" spellcheck="false"></textarea></label>
      <p class="muted" style="font-size:13px">게임마다 이 목록에서 정한 수만큼 단어를 무작위로 골라 새로 배치합니다. 학생들이 풀기 전까지 퍼즐 모양은 선생님 화면에도 나오지 않습니다.</p>
    </section>
  </div>`;
    const sel=$("#setSel"), nSel=$("#nSel"), ta=$("#words");
    const allText=()=>Object.values(SETS).join("\n");
    const fill=()=>{ ta.value=sel.value===CUSTOM?(S.customText??""):sel.value===ALL?allText():SETS[sel.value]; };
    sel.value=S.setChoice||Object.keys(SETS)[0]; nSel.value=S.nChoice??"15"; fill();
    const count=()=>{const n=parseList(ta.value).length;$("#wcount").textContent=`한 줄에 하나씩 · 용어 | 설명 (${n}개)`;updateSetupLive();};
    count();
    sel.onchange=()=>{S.setChoice=sel.value; fill(); count();};
    nSel.onchange=()=>{S.nChoice=nSel.value;};
    ta.oninput=()=>{S.customText=ta.value; if(sel.value!==CUSTOM){sel.value=CUSTOM;S.setChoice=CUSTOM;} count();};
    $("#startBtn").onclick=()=>{
      const list=parseList(ta.value); if(list.length<2) return toast("용어를 2개 이상 입력해 주세요.");
      const puzzle=generate(sampleWords(list,+nSel.value));
      const name=sel.value===CUSTOM?"직접 입력한 용어":sel.value===ALL?"전체 단원":sel.value;
      queueWrite(()=>S.db.doc("rooms/"+S.code).set({...S.room,status:"playing",gameId:rid(),puzzle,setName:name,startAt:Date.now()+3500,endAt:null,firstFinisher:null}));
    };
  }
  updateSetupLive();
}
function updateSetupLive(){
  const players=curPlayers(), btn=$("#startBtn"); if(!btn) return;
  const ta=$("#words"); btn.disabled=!(players.length&&ta&&parseList(ta.value).length>=2);
  btn.textContent=`게임 시작 (${players.length}/${MAX_PLAYERS}명)`;
  $("#slots").innerHTML=[0,1,2,3].map(s=>{const p=players.find(x=>x.slot===s);return p?`<div class="slot on" style="--pc:${COLORS[s]}"><span class="dot"></span><b>${esc(p.name)}</b><button class="ghost kick" data-kick="${esc(p.pid)}">내보내기</button></div>`:`<div class="slot" style="--pc:${COLORS[s]}"><span class="muted">빈 자리</span></div>`}).join("");
  document.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>queueWrite(()=>S.db.doc(`rooms/${S.code}/players/${b.dataset.kick}`).delete()));
}

/* ---------- 학생 ---------- */
function myDoc(){ return S.players.find(p=>p.pid===S.pid); }
function mySolved(){ const me=myDoc(); const base=me?validSolved(me):{}; const m=S.room&&S.room.gameId?myState():null; return m?{...base,...m.solved}:base; }
function renderPlayer(){
  const ph=phase(), room=S.room;
  if(room.status==="setup"||ph==="lobby"||!room.puzzle){
    S.skel="plobby";
    const players=curPlayers();
    $("#view").innerHTML=`<section class="sheet stack">
      <h2>선생님이 게임을 시작하기를 기다리는 중</h2>
      <p class="muted">시작되면 모든 참가자에게 같은 퍼즐이 동시에 열립니다.</p>
      <div class="slots">${[0,1,2,3].map(s=>{const p=players.find(x=>x.slot===s);return p?`<div class="slot on" style="--pc:${COLORS[s]}"><span class="dot"></span><b>${esc(p.name)}</b>${p.pid===S.pid?`<span class="muted">(나)</span>`:""}</div>`:`<div class="slot" style="--pc:${COLORS[s]}"><span class="muted">빈 자리</span></div>`}).join("")}</div>
    </section>`; return;
  }
  if(ph==="countdown"){ S.skel="pcount"; $("#view").innerHTML=`<section class="sheet"><p class="muted">곧 시작합니다…</p></section>`; return; }
  const pz=room.puzzle, solved=mySolved(), total=pz.words.length;
  if(S.sel==null||solved[S.sel]!=null){ const nx=pz.words.find(w=>solved[w.id]==null); S.sel=nx?nx.id:null; }
  const key="pgame:"+room.gameId;
  if(S.skel!==key){
    S.skel=key; S.abarKey=null;
    $("#view").innerHTML=`
  <div class="stack">
    <div class="strip"><span id="timer" class="timer">--:--</span><span id="chips" class="strip"></span></div>
    <div id="pnotice"></div>
    <div class="board">
      <section class="sheet stack">
        <div class="row" style="justify-content:space-between"><h3>내 퍼즐</h3><span class="mono" id="myScore"></span></div>
        <div class="gridbox" id="gbox"></div>
      </section>
      <section class="stack">
        <div class="answerbar" id="abar"></div>
        <div class="sheet clues">
          <div><span class="label">가로</span><ol id="clA"></ol></div>
          <div><span class="label">세로</span><ol id="clD"></ol></div>
        </div>
      </section>
    </div>
  </div>`;
  }
  const st=standings();
  const locked=ph!=="playing"||S.readOnly;
  $("#chips").innerHTML=st.map(p=>`<span class="chip ${p.pid===S.pid?"me":""}"><span class="dot" style="background:${COLORS[p.slot]}">${p.score}</span>${esc(p.name)}${p.finished?" 🏁":""}</span>`).join("");
  $("#pnotice").innerHTML=room.firstFinisher&&room.firstFinisher.pid!==S.pid&&ph==="playing"?`<div class="notice"><b>${esc(room.firstFinisher.name)}</b> 학생이 퍼즐을 모두 풀었습니다. 30초 안에 하나라도 더 맞혀 보세요!</div>`:"";
  $("#myScore").innerHTML=`<b>${Object.keys(solved).length}</b> / ${total}`;
  const clueList=d=>pz.words.filter(w=>w.d===d).map(w=>`<li data-w="${w.id}" class="${w.id===S.sel?"active":""} ${solved[w.id]!=null?"done":""}"><span class="k">${w.n}</span><span>${esc(w.clue)} <span class="muted mono">(${Array.from(w.w).length})</span></span></li>`).join("");
  $("#clA").innerHTML=clueList("a"); $("#clD").innerHTML=clueList("d");
  const box=$("#gbox"); box.innerHTML=gridHTML(pz,{filled:solved,sel:S.sel,cs:cellSize(pz,box)});
  if(S.popWords){ S.popWords.forEach(id=>{const w=pz.words[id]; Array.from(w.w).forEach((_,i)=>{const el=box.querySelector(`[data-k="${w.r+(w.d==="d"?i:0)},${w.c+(w.d==="a"?i:0)}"]`); el&&el.classList.add("pop");});}); S.popWords=null; }
  // 답 입력칸은 선택한 단어나 잠금 상태가 바뀔 때만 다시 만든다 (한글 조합 입력이 끊기지 않도록)
  const abKey=S.sel+":"+locked;
  if(S.abarKey!==abKey){
    S.abarKey=abKey;
    const sw=S.sel!=null?pz.words[S.sel]:null;
    $("#abar").innerHTML=sw?`<p class="q"><b>${sw.n}번 ${sw.d==="a"?"가로":"세로"}</b> · ${Array.from(sw.w).length}글자</p><p>${esc(sw.clue)}</p>
      <form id="af"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="정답 입력 후 Enter" ${locked?"disabled":""}><button class="primary" ${locked?"disabled":""}>확인</button></form>`
      :`<p class="q"><b>모든 단어를 맞혔습니다!</b></p><p class="muted">게임이 끝날 때까지 기다려 주세요.</p>`;
    $("#af")&&($("#af").onsubmit=e=>{e.preventDefault(); submitAnswer();});
    if(!locked&&S.focusAns) $("#ans")&&$("#ans").focus();
  }
  S.focusAns=false;
  const cm=cellMap(pz);
  box.querySelectorAll(".c[data-k]").forEach(el=>el.onclick=()=>{
    const cell=cm.get(el.dataset.k); const open=cell.words.filter(id=>solved[id]==null);
    const opts=open.length?open:cell.words; let next=opts[0];
    if(opts.includes(S.sel)&&opts.length>1) next=opts[(opts.indexOf(S.sel)+1)%opts.length];
    S.sel=next; S.focusAns=true; render();
  });
  document.querySelectorAll("[data-w]").forEach(li=>li.onclick=()=>{S.sel=+li.dataset.w;S.focusAns=true;render();});
}
function myState(){
  // 내 진행 상황의 기준 사본 (서버 확인 전에도 바로 반영)
  const room=S.room, me=myDoc();
  if(!S.mine||S.mine.gameId!==room.gameId){
    const fresh=me&&me.gameId===room.gameId;
    S.mine={gameId:room.gameId,solved:fresh?{...(me.solved||{})}:{},wrong:fresh?(me.wrong||0):0};
  }
  return S.mine;
}
// 다른 단어들의 정답으로 모든 칸이 채워진 단어는 자동으로 맞힌 것으로 처리
function autoComplete(pz,solved,t){
  const filled=new Set();
  pz.words.forEach(w=>{ if(solved[w.id]==null) return; Array.from(w.w).forEach((_,i)=>filled.add((w.r+(w.d==="d"?i:0))+","+(w.c+(w.d==="a"?i:0)))); });
  const added=[];
  pz.words.forEach(w=>{ if(solved[w.id]!=null) return;
    if(Array.from(w.w).every((_,i)=>filled.has((w.r+(w.d==="d"?i:0))+","+(w.c+(w.d==="a"?i:0))))){ solved[w.id]=t; added.push(w.id); } });
  return added;
}
function submitAnswer(){
  const inp=$("#ans"); if(!inp||phase()!=="playing") return;
  const val=inp.value.replace(/\s+/g,""); if(!val) return;
  const room=S.room, w=room.puzzle.words[S.sel], me=myDoc(); if(!w||!me) return;
  const m=myState();
  const save=()=>{const body={pid:S.pid,name:me.name,slot:me.slot,joinedAt:me.joinedAt,gameId:m.gameId,solved:{...m.solved},wrong:m.wrong};
    return queueWrite(()=>S.db.doc(`rooms/${S.code}/players/${S.pid}`).set(body));};
  if(val===w.w){
    const now=Date.now(); m.solved[w.id]=now; inp.value="";
    const auto=autoComplete(room.puzzle,m.solved,now); S.popWords=[w.id,...auto];
    const done=Object.keys(m.solved).length===room.puzzle.words.length;
    toast(done?"모두 맞혔습니다!":auto.length?`정답! 다른 정답으로 다 채워진 ${auto.map(id=>{const x=room.puzzle.words[id];return x.n+"번 "+(x.d==="a"?"가로":"세로");}).join(", ")}도 함께 맞힘`:"정답!");
    const t=m.solved[w.id];
    save().then(()=>{ if(done&&!S.room.endAt) setFirst({pid:S.pid,name:S.name,finished:t}); });
    S.sel=null; S.focusAns=true; render();
  }else{
    m.wrong++; const bar=$("#abar"); bar.classList.remove("shake"); void bar.offsetWidth; bar.classList.add("shake"); inp.select();
    save();
  }
}
/* ---------- 오버레이 (카운트다운, 결과) ---------- */
function renderLayer(){
  const ph=phase(), L=$("#layer");
  if(ph==="countdown"){ if(!$("#countNum")) L.innerHTML=`<div class="overlay"><div class="stack" style="align-items:center"><span class="label">퍼즐 공개까지</span><span class="count" id="countNum"></span></div></div>`; return; }
  if(ph==="ended"&&S.room.puzzle){
    const st=standings(), r=S.room;
    const medal=["🥇","🥈","🥉","4"];
    L.innerHTML=`<div class="overlay"><section class="sheet results">
      <span class="label">게임 종료 · ${esc(r.setName||"")}</span>
      <h2>최종 순위</h2>
      ${st.map((p,i)=>`<div class="rank ${i===0?"first":""}" style="--pc:${COLORS[p.slot]}">
        <span class="pos">${medal[i]||i+1}</span>
        <div><b>${esc(p.name)}</b>${p.pid===S.pid?` <span class="muted">(나)</span>`:""}<div class="meta">${p.finished?`완주 ${fmt(p.finished-r.startAt)}`:p.score?`마지막 정답 ${fmt(p.last-r.startAt)}`:"정답 없음"}</div></div>
        <span class="mono" style="font-size:22px;font-weight:700">${p.score}<span class="muted" style="font-size:14px">/${p.total}</span></span>
      </div>`).join("")}
      <div class="row">${S.role==="teacher"?`<button class="primary" id="again2">새 게임 준비</button><button class="ghost" id="closeRes">퍼즐 보기</button>`:`<button class="ghost" id="closeRes">퍼즐 다시 보기</button><span class="muted" style="font-size:13px">선생님이 새 게임을 준비하면 자동으로 넘어갑니다.</span>`}</div>
    </section></div>`;
    if(S.resClosed===r.gameId) L.innerHTML="";
    $("#closeRes")&&($("#closeRes").onclick=()=>{S.resClosed=r.gameId;S.showAnswers=true;L.innerHTML="";render();});
    $("#again2")&&($("#again2").onclick=()=>{S.draftPuzzle=r.puzzle;queueWrite(()=>S.db.doc("rooms/"+S.code).update({status:"lobby",startAt:null,endAt:null,firstFinisher:null}));});
    return;
  }
  L.innerHTML="";
}
window.addEventListener("resize",()=>{ clearTimeout(S.rz); S.rz=setTimeout(()=>S.room&&render(),150); });
</script>
